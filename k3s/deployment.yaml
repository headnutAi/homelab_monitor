apiVersion: apps/v1
kind: Deployment
metadata:
  name: remotemonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: monitorcontain
        image: monitor:0.2
        ports:
        - containerPort: 8090
        env:
        - name: MONITOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: monitor-api-secret
              key: api-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
