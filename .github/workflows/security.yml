name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # montags 6 Uhr UTC

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks ausführen
        uses: gitleaks/gitleaks-action@v2